apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-ai
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: devops-ai-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: LLM_BASE_URL
              value: "http://ollama:11434"
            - name: LLM_MODEL
              value: "llama3.2"
            - name: MCP_BASE_URL
              value: "http://mcp-server"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
