apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-ai-ingress
  namespace: devops-ai
spec:
  ingressClassName: traefik
  rules:
    - host: devops-ai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
