<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps AI Assistant</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #2f81f7;
            --accent-hover: #388bfd;
            --user-bubble: #1f4788;
            --ai-bubble: #161b22;
            --code-bg: #0d1117;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d29922;
            --radius: 8px;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .logo {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
        }

        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .badge.online { border-color: var(--green); color: var(--green); }

        /* ── Toolbar ── */
        .toolbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .toolbar label { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 0.4rem; }

        select {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 0.3rem 0.5rem;
            font-size: 12px;
            cursor: pointer;
        }

        select:focus { outline: none; border-color: var(--accent); }

        .toolbar-right { margin-left: auto; display: flex; gap: 0.5rem; }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: var(--radius);
            padding: 0.3rem 0.7rem;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

        /* ── Messages ── */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .msg-row {
            display: flex;
            gap: 0.75rem;
            max-width: 820px;
            width: 100%;
        }

        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        .avatar.user-av { background: var(--accent); color: #fff; }
        .avatar.ai-av { background: var(--surface2); border: 1px solid var(--border); }

        .bubble {
            border-radius: var(--radius);
            padding: 0.7rem 1rem;
            max-width: calc(100% - 42px);
            line-height: 1.6;
            word-break: break-word;
        }

        .bubble.user { background: var(--user-bubble); }
        .bubble.ai { background: var(--ai-bubble); border: 1px solid var(--border); }

        .bubble .meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        /* ── Markdown rendering ── */
        .bubble h1,.bubble h2,.bubble h3 {
            font-size: 14px; font-weight: 600;
            margin: 0.6rem 0 0.3rem;
            color: var(--text);
        }

        .bubble p { margin: 0.3rem 0; }

        .bubble ul, .bubble ol {
            padding-left: 1.4rem;
            margin: 0.3rem 0;
        }

        .bubble li { margin: 0.15rem 0; }

        .bubble code {
            font-family: var(--font-mono);
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 12px;
        }

        .code-block {
            position: relative;
            margin: 0.6rem 0;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .code-header {
            background: var(--surface2);
            padding: 0.3rem 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }
        .copy-btn:hover { background: var(--border); color: var(--text); }
        .copy-btn.copied { color: var(--green); }

        .code-block pre {
            margin: 0;
            padding: 0.75rem;
            overflow-x: auto;
            background: var(--code-bg);
        }

        .code-block pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 12.5px;
            line-height: 1.55;
        }

        .bubble strong { font-weight: 600; }
        .bubble em { font-style: italic; color: var(--text-muted); }

        /* ── Typing indicator ── */
        .typing-row { display: flex; align-items: center; gap: 0.75rem; }

        .typing-dots {
            display: flex; gap: 4px;
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.6rem 0.9rem;
        }

        .typing-dots span {
            width: 6px; height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* ── Error ── */
        .error-msg {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: var(--red);
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            font-size: 13px;
        }

        /* ── Empty state ── */
        #empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        #empty-state .icon { font-size: 40px; }
        #empty-state p { font-size: 13px; text-align: center; max-width: 280px; line-height: 1.5; }

        /* ── Input area ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            background: var(--surface);
            flex-shrink: 0;
        }

        .input-wrap {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem;
            transition: border-color 0.15s;
        }

        .input-wrap:focus-within { border-color: var(--accent); }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            max-height: 160px;
            outline: none;
            padding: 0.2rem 0.3rem;
        }

        #user-input::placeholder { color: var(--text-muted); }

        #user-input::-webkit-scrollbar { width: 4px; }
        #user-input::-webkit-scrollbar-thumb { background: var(--border); }

        #send-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            border-radius: 6px;
            width: 34px; height: 34px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, opacity 0.15s;
        }

        #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #send-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .input-hint {
            margin-top: 0.4rem;
            color: var(--text-muted);
            font-size: 11px;
            text-align: right;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">⚙️</div>
        <h1>DevOps AI Assistant</h1>
        <span class="badge" id="status-badge">connecting…</span>
    </header>

    <div class="toolbar">
        <label>
            Model
            <select id="model-select"></select>
        </label>
        <div class="toolbar-right">
            <button class="btn-ghost" onclick="clearConversation()">Clear chat</button>
        </div>
    </div>

    <div id="messages">
        <div id="empty-state">
            <div class="icon">🤖</div>
            <p>Ask me anything about Kubernetes, CI/CD, Docker, monitoring, or any DevOps topic.</p>
        </div>
    </div>

    <footer>
        <div class="input-wrap">
            <textarea
                id="user-input"
                rows="1"
                placeholder="Ask a DevOps question… (Enter to send, Shift+Enter for newline)"
            ></textarea>
            <button id="send-btn" onclick="sendMessage()" title="Send (Enter)">
                <svg viewBox="0 0 16 16"><path d="M.989 8 .064 2.68a1 1 0 0 1 1.357-1.11l13 5.5a1 1 0 0 1 0 1.86l-13 5.5a1 1 0 0 1-1.357-1.11L.989 9H8a1 1 0 0 0 0-2H.989Z"/></svg>
            </button>
        </div>
        <div class="input-hint">Shift+Enter for newline</div>
    </footer>

    <script>
        const history = [];
        let streaming = false;

        // ── Model loading ──
        async function loadModels() {
            try {
                const resp = await fetch('/models');
                const { models } = await resp.json();
                const select = document.getElementById('model-select');
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = opt.textContent = m;
                    select.appendChild(opt);
                });
                setStatus(true);
            } catch {
                setStatus(false);
            }
        }

        function setStatus(online) {
            const badge = document.getElementById('status-badge');
            badge.textContent = online ? 'online' : 'offline';
            badge.className = 'badge' + (online ? ' online' : '');
        }

        // ── Auto-resize textarea ──
        const textarea = document.getElementById('user-input');
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        });

        textarea.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ── Send ──
        async function sendMessage() {
            if (streaming) return;
            const msg = textarea.value.trim();
            if (!msg) return;

            textarea.value = '';
            textarea.style.height = 'auto';
            hideEmpty();

            const model = document.getElementById('model-select').value;
            appendUserMessage(msg);
            history.push({ role: 'user', content: msg });

            const typingEl = showTyping();
            setStreaming(true);

            try {
                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, history: history.slice(0, -1), model })
                });

                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                typingEl.remove();
                const { bubble } = appendAIMessage('');
                let full = '';

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    full += decoder.decode(value, { stream: true });
                    bubble.innerHTML = renderMarkdown(full);
                    wireCodeCopies(bubble);
                    scrollBottom();
                }

                history.push({ role: 'assistant', content: full });
            } catch (err) {
                typingEl.remove();
                appendError('Failed to get a response. ' + err.message);
            } finally {
                setStreaming(false);
            }
        }

        function setStreaming(on) {
            streaming = on;
            document.getElementById('send-btn').disabled = on;
        }

        // ── DOM helpers ──
        function hideEmpty() {
            const el = document.getElementById('empty-state');
            if (el) el.remove();
        }

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `
                <div class="avatar user-av">U</div>
                <div class="bubble user">${escapeHtml(text)}</div>`;
            document.getElementById('messages').appendChild(row);
            scrollBottom();
        }

        function appendAIMessage(text) {
            const row = document.createElement('div');
            row.className = 'msg-row';
            const bubble = document.createElement('div');
            bubble.className = 'bubble ai';
            bubble.innerHTML = text ? renderMarkdown(text) : '';
            row.innerHTML = `<div class="avatar ai-av">🤖</div>`;
            row.appendChild(bubble);
            document.getElementById('messages').appendChild(row);
            scrollBottom();
            return { row, bubble };
        }

        function showTyping() {
            const row = document.createElement('div');
            row.className = 'msg-row typing-row';
            row.innerHTML = `
                <div class="avatar ai-av">🤖</div>
                <div class="typing-dots"><span></span><span></span><span></span></div>`;
            document.getElementById('messages').appendChild(row);
            scrollBottom();
            return row;
        }

        function appendError(msg) {
            const el = document.createElement('div');
            el.className = 'error-msg';
            el.textContent = '⚠ ' + msg;
            document.getElementById('messages').appendChild(el);
            scrollBottom();
        }

        function scrollBottom() {
            const m = document.getElementById('messages');
            m.scrollTop = m.scrollHeight;
        }

        function clearConversation() {
            history.length = 0;
            const m = document.getElementById('messages');
            m.innerHTML = `<div id="empty-state">
                <div class="icon">🤖</div>
                <p>Ask me anything about Kubernetes, CI/CD, Docker, monitoring, or any DevOps topic.</p>
            </div>`;
        }

        // ── Copy code buttons ──
        function wireCodeCopies(container) {
            container.querySelectorAll('.copy-btn[data-code]').forEach(btn => {
                if (btn._wired) return;
                btn._wired = true;
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(btn.dataset.code).then(() => {
                        btn.textContent = 'Copied!';
                        btn.classList.add('copied');
                        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
                    });
                });
            });
        }

        // ── Minimal markdown renderer ──
        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function renderMarkdown(text) {
            // Fenced code blocks
            text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                const escaped = escapeHtml(code.trimEnd());
                const label = lang || 'code';
                const raw = code.trimEnd();
                const safeRaw = raw.replace(/"/g, '&quot;');
                return `<div class="code-block">
                    <div class="code-header">
                        <span>${escapeHtml(label)}</span>
                        <button class="copy-btn" data-code="${safeRaw}">Copy</button>
                    </div>
                    <pre><code>${escaped}</code></pre>
                </div>`;
            });

            // Headers
            text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Bold / italic
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Unordered lists (group consecutive lines)
            text = text.replace(/((?:^[ \t]*[-*+] .+\n?)+)/gm, match => {
                const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[ \t]*[-*+] /, '')}</li>`).join('');
                return `<ul>${items}</ul>`;
            });

            // Ordered lists
            text = text.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
                const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
                return `<ol>${items}</ol>`;
            });

            // Paragraphs (double newline → <p>)
            text = text.split(/\n\n+/).map(para => {
                para = para.trim();
                if (!para) return '';
                if (/^<(h[1-3]|ul|ol|div)/.test(para)) return para;
                return `<p>${para.replace(/\n/g, '<br>')}</p>`;
            }).join('\n');

            return text;
        }

        loadModels();
    </script>
</body>

</html>
